name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: lint / test / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Git 分发契约（docs/git-distribution.md §3.3）：packages/loader/lib 是随仓内嵌的
      # 可安装制品（github: 默认安装零构建）。重新构建后必须与提交内容逐字节一致——
      # 有漂移说明源码改了但制品没重生成，会静默分发过期的 host/client 半。
      - name: Check committed loader artifacts are fresh
        if: runner.os == 'Linux'
        run: git diff --exit-code -- packages/loader/lib
